name: moviepro Unofficial API 🔥

on:
  schedule:
    - cron: "0 */6 * * *"   #paya 6 🚀
  workflow_dispatch:          
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Scrape & build API
        run: python main.py

      - name: Commit api.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/
          git diff --cached --quiet && echo "No changes" || git commit -m "API update $(date -u +%FT%TZ)"
          git push
