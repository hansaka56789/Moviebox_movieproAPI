name: moviepro Unofficial API 🔥

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # hours 6n 6ta auto run wenawa
  push:
    branches: [ main ]

jobs:
  build-api:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Scrape & build API
        run: |
          python main.py

      - name: Commit api.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add output/api.json || git add api.json || true
          git diff --staged --quiet || git commit -m "update api.json - $(date -u)"
          git push
